# Full generation evals (python evals.py --with-llm) against Claude.
# Each run makes about 38 Anthropic API calls per retrieval mode (about $0.27 per mode).
# Runs weekly and on manual dispatch only: never on pull_request, so forks
# cannot reach the API key and PRs do not spend money.

name: LLM evals

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      retrieval:
        description: Retrieval mode to evaluate
        type: choice
        options: [both, vector, hybrid]
        default: both

permissions:
  contents: read

concurrency:
  group: llm-evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has-key: ${{ steps.check.outputs.has-key }}
    steps:
      - id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "has-key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-key=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=LLM evals skipped::ANTHROPIC_API_KEY repository secret is not set. Add it with 'gh secret set ANTHROPIC_API_KEY' to enable these evals."
            {
              echo "## LLM evals skipped"
              echo
              echo "The \`ANTHROPIC_API_KEY\` repository secret is not set, so no evals ran."
              echo "Add it with \`gh secret set ANTHROPIC_API_KEY\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  evals:
    needs: check-secret
    if: needs.check-secret.outputs.has-key == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs have no inputs, so they fall through to both modes.
        retrieval: ${{ fromJSON(inputs.retrieval == 'vector' && '["vector"]' || inputs.retrieval == 'hybrid' && '["hybrid"]' || '["vector","hybrid"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch (keeps the install small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Ingest sample corpus
        run: python ingest.py

      - name: Full evals (${{ matrix.retrieval }})
        id: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          RETRIEVAL: ${{ matrix.retrieval }}
        run: |
          mkdir -p eval-results
          set +e
          python evals.py --with-llm --verbose --retrieval "$RETRIEVAL" \
            --output "eval-results/evals-$RETRIEVAL.json" 2>&1 | tee "eval-results/evals-$RETRIEVAL.log"
          status=${PIPESTATUS[0]}
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write job summary from the run artifact
        if: always() && steps.evals.outcome != 'skipped'
        env:
          RETRIEVAL: ${{ matrix.retrieval }}
          EXIT_CODE: ${{ steps.evals.outputs.exit-code }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python
        run: |
          import json, os
          from pathlib import Path

          # evals.py --output wrote the artifact (schema in eval_artifact.py);
          # the exit code stays the source of truth for pass/fail.
          mode = os.environ["RETRIEVAL"]
          exit_code = os.environ.get("EXIT_CODE") or "missing"
          path = Path(f"eval-results/evals-{mode}.json")
          lines = [f"## LLM evals: {mode} retrieval - {'PASS' if exit_code == '0' else 'FAIL'}", ""]
          if not path.exists():
              lines.append(f"- No run artifact (evals.py exited with {exit_code}); see the log artifact.")
          else:
              a = json.loads(path.read_text())
              blocks = [a["results"]["retrieval"], a["results"]["full"]]
              ran = [b for b in blocks if "summary" in b]
              passed = sum(b["summary"]["passed"] for b in ran)
              total = sum(b["summary"]["total"] for b in ran)
              failing = sorted({c["id"] for b in ran for c in b["cases"] if c["status"] != "pass"})

              def dims(block):
                  if "summary" not in block:
                      return "not run"
                  return ", ".join(f"{name} {d['passed']}/{d['passed'] + d['failed']}"
                                   f" ({d['unevaluated']} unevaluated)"
                                   for name, d in block["summary"]["by_dimension"].items())

              heldout = {name: b for name, b in a["heldout"].items()
                         if isinstance(b, dict) and "summary" in b}
              usage = a["results"]["full"].get("summary", {}).get("usage", {})
              gen = a["generation"]
              lines += [
                  f"- Combined: {passed}/{total}",
                  f"- By dimension (full): {dims(a['results']['full'])}",
                  f"- Provider errors: {a['results']['full'].get('summary', {}).get('provider_errors', 'n/a')}",
                  f"- Failing cases: {', '.join(failing) if failing else 'none'}",
                  "- Held-out (not in the exit code): "
                  + ", ".join(f"{name} {b['summary']['passed']}/{b['summary']['total']}"
                              for name, b in heldout.items()),
                  f"- Model: requested {gen.get('requested_model')}, returned "
                  f"{', '.join(gen.get('response_models') or []) or 'not reported'}",
                  f"- Tokens (main set): {usage.get('tokens') or 'not reported'} over "
                  f"{usage.get('calls_with_usage', 0)}/{usage.get('provider_calls', 0)} calls",
                  f"- Commit: {a['code'].get('git_sha')}"
                  + (" (dirty)" if a["code"].get("git_dirty") else ""),
                  f"- Corpus SHA-256: {a['corpus'].get('corpus_sha256') or 'unavailable'}",
              ]
          lines += [f"- Run: {os.environ['RUN_URL']}", ""]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")

      - name: Upload eval results
        if: always() && steps.evals.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: llm-evals-${{ matrix.retrieval }}
          path: eval-results/
          retention-days: 90

      - name: Fail job if evals failed
        if: steps.evals.outputs.exit-code != '0'
        env:
          EXIT_CODE: ${{ steps.evals.outputs.exit-code }}
        run: |
          echo "::error title=LLM evals failed::python evals.py --with-llm exited with ${EXIT_CODE:-no exit code}"
          exit 1
