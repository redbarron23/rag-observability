name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only torch (keeps the install small)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/ -v

      - name: Ingest sample corpus
        run: python ingest.py

      - name: Retrieval evals (no API key needed)
        run: python evals.py

      - name: Adversarial offline checks (separate fixture index, no API key needed)
        run: python adversarial_evals.py

      - name: Real collector scenarios, privacy, outage and recovery
        run: python telemetry_checks.py

      - name: Retain sanitized telemetry results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telemetry-results
          path: telemetry-results.json
          retention-days: 7
