version: 2
updates:
  # Python packages. Bumps beyond the upper bounds in requirements*.txt
  # come through as PRs, so CI runs before anything changes.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
